<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host Grabber</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><header><div class="brand"><span class="mark">HG</span><div><strong>Host Grabber</strong><small id="mode">Manueller Modus</small></div></div><button id="options" class="icon" aria-label="Einstellungen">⚙</button></header><main><section class="toolbar"><label>Bereich<select id="scope"><option value="page">Ganze Seite</option><option value="selection">Markierter Bereich</option></select></label><button id="scan" class="button primary">Bilder ermitteln</button></section><section class="sticky-actions"><button id="download" class="button download" disabled>Ausgewählte Originale herunterladen</button><section id="progressWrap" class="hidden"><div class="progress-label"><span id="progressText"></span><button id="cancel" class="link">Abbrechen</button></div><progress id="progress" max="1"></progress></section><div id="notice" class="notice">Bereit.</div></section><section id="resultBox" class="card hidden"><div class="result-head"><label class="inline"><input id="all" type="checkbox" checked>Alle</label><span id="count" class="badge">0</span><input id="filter" type="search" placeholder="URL filtern …"></div><div id="results" class="results"></div></section><details id="debugBox" class="hidden"><summary>Debug-Protokoll (<span id="debugCount">0</span>)</summary><div class="debug-actions"><button id="copyDebug" class="button secondary">Kopieren</button><button id="downloadDebug" class="button secondary">JSON herunterladen</button></div><pre id="debugLog"></pre></details><details><summary>Für diesen Download ändern</summary><div class="form-grid"><label>Zielordner<input id="folder"></label><label>Ordnermodus<select id="folderMode"><option value="fixed">Fester Ordner</option><option value="title">Webseitentitel</option><option value="fixed-title">Fester Ordner / Webseitentitel</option></select></label><label>Dateinamen<select id="naming"><option value="original">Originalname</option><option value="numbered">Nummer + Originalname</option><option value="prefix">Präfix + Nummer</option></select></label><label id="prefixWrap">Präfix<input id="prefix"></label><label>Parallel<select id="concurrency"><option>1</option><option>2</option><option>4</option><option>6</option><option>8</option><option>12</option></select></label></div></details></main><script src="popup.js"></script></body></html>
