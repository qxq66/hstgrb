<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host Grabber</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
<header>
  <div class="brand"><span class="mark">HG</span><div><strong>Host Grabber</strong><small id="mode">Manueller Modus</small></div></div>
  <button id="options" class="icon" aria-label="Einstellungen">⚙</button>
</header>
<main>
  <section class="toolbar">
    <label>Bereich<select id="scope"><option value="page">Ganze Seite</option><option value="selection">Markierter Bereich</option></select></label>
    <button id="scan" class="button primary">Bilder ermitteln</button>
  </section>
  <section class="manager-actions">
    <button id="openManager" class="button secondary">Download-Manager öffnen</button>
  </section>
  <div id="notice" class="notice">Bereit. Gefundene Originale werden dem Download-Manager hinzugefügt.</div>
  <section id="resultBox" class="card hidden">
    <div class="result-head"><label class="inline"><input id="all" type="checkbox" checked>Alle</label><span id="count" class="badge">0</span><input id="filter" type="search" placeholder="URL filtern …"></div>
    <div id="results" class="results"></div>
  </section>
  <details id="debugBox" class="hidden">
    <summary>Debug-Protokoll (<span id="debugCount">0</span>)</summary>
    <div class="debug-actions"><button id="copyDebug" class="button secondary">Kopieren</button><button id="downloadDebug" class="button secondary">JSON herunterladen</button></div>
    <pre id="debugLog"></pre>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
