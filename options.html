<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host Grabber – Optionen</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="options">
<header><div class="brand"><span class="mark">HG</span><div><h1>Host Grabber</h1><small>Standards, Automatik und Hoster-Regeln</small></div></div><button id="save" class="button primary">Alle Einstellungen speichern</button></header>
<main class="options-main">
<nav>
<button data-view="defaults" class="nav active">Standardeinstellungen</button>
<button data-view="automation" class="nav">Automatik</button>
<button data-view="rules" class="nav">Hoster-Regeln</button>
<div id="saved" class="notice hidden"></div>
</nav>
<div class="views">
<section id="defaults" class="view panel">
<h2>Standardeinstellungen</h2>
<p>Diese Werte werden beim Hinzufügen neuer Downloads verwendet.</p>
<div class="settings-grid">
<label>Parallele Downloads<select id="defConcurrency"><option>1</option><option>2</option><option>4</option><option>6</option><option>8</option><option>12</option></select></label>
<label>Neue Downloads<select id="managerStartMode"><option value="start">Sofort starten</option><option value="paused">Pausiert hinzufügen</option></select></label>
<label>Bereich<select id="defScope"><option value="page">Ganze Seite</option><option value="selection">Markierter Bereich</option></select></label>
<label>Dateinamen<select id="defNaming"><option value="original">Originalname</option><option value="numbered">Nummer + Originalname</option><option value="prefix">Präfix + Nummer</option></select></label>
<label>Präfix<input id="defPrefix"></label>
<label class="span-2">Basis-Zielordner<input id="defFolder" placeholder="HostGrabber"></label>
<label class="span-2">Ordnerbildung<select id="defFolderMode"><option value="fixed">Nur Basis-Zielordner</option><option value="title">Nur Webseitentitel</option><option value="fixed-title">Basis-Zielordner / Webseitentitel</option></select></label>
</div>
</section>
<section id="automation" class="view panel hidden">
<h2>Automatik</h2>
<div class="toggle-list">
<label class="toggle"><input id="toolbarAutoScan" type="checkbox"><span><strong>Toolbar-Klick automatisch scannen</strong><small>Beim Klick auf das Symbol werden Bilder ermittelt und dem Download-Manager hinzugefügt.</small></span></label>
<label class="toggle"><input id="autoScan" type="checkbox"><span><strong>Beim Laden whitelisted Seiten automatisch scannen</strong><small>Nur Seiten, deren URL einen Whitelist-Ausdruck erfüllt, werden automatisch verarbeitet.</small></span></label>
<label class="toggle"><input id="showBadge" type="checkbox"><span><strong>Trefferzahl anzeigen</strong><small>Zeigt die Zahl gefundener Originale im Symbol.</small></span></label>
<label class="toggle"><input id="debugMode" type="checkbox"><span><strong>Debug-Modus</strong><small>Protokolliert relevante Kandidaten, Transformationen und Fehler.</small></span></label>
</div>
<label>Auto-Scan-Whitelist<small>Eine URL pro Zeile im Tampermonkey-Format, zum Beispiel <code>https://test.com/*</code> oder <code>*://*.test.com/*</code>.</small><textarea id="whitelist" rows="8"></textarea></label>
</section>
<section id="rules" class="view hidden">
<div class="rules-layout">
<aside class="rule-side">
<div class="rule-actions"><button id="add" class="button secondary">+ Regel</button><button id="duplicate" class="button secondary">Duplizieren</button><button id="export" class="button secondary">Export</button><label class="button secondary file">Import hinzufügen<input id="import" type="file" accept=".json,application/json"></label></div>
<div id="ruleList"></div>
</aside>
<article class="panel">
<div id="empty">Regel auswählen.</div>
<form id="ruleForm" class="hidden">
<div class="title-row"><label>Name<input id="name"></label><label class="inline"><input id="enabled" type="checkbox">Aktiv</label></div>
<small id="ruleId"></small>
<fieldset><legend>Erkennung</legend><div class="three"><label>Feld<select id="matchField"><option>linkUrl</option><option>imageUrl</option><option>pageUrl</option></select></label><label>Match-RegEx<input id="matchPattern"></label><label>Flags<input id="matchFlags"></label></div></fieldset>
<fieldset><legend>Auflösung</legend><div class="three"><label>Quelle<select id="source"><option>linkUrl</option><option>imageUrl</option><option>pageUrl</option></select></label><label>Verfahren<select id="resolverType"><option value="direct">Direkte URL</option><option value="fetch-regex">Landingpage + RegEx</option><option value="fetch-css">Landingpage + CSS</option></select></label></div><div id="regexFields" class="hidden"><label>Extraktions-RegEx<input id="extractPattern"></label><label>Gruppe<input id="extractGroup" type="number"></label><label>Flags<input id="extractFlags"></label></div><div id="cssFields" class="hidden"><label>CSS-Selektor<input id="selector"></label><label>Attribut<input id="attribute"></label></div></fieldset>
<fieldset><legend>Transformationen</legend><textarea id="transforms" rows="9"></textarea></fieldset>
<div id="validation" class="notice"></div>
<button id="delete" type="button" class="button danger">Regel löschen</button>
</form>
</article>
</div>
</section>
</div>
</main>
<script src="lib/core.js"></script>
<script src="lib/fixes.js"></script>
<script src="options.js"></script>
</body>
</html>
